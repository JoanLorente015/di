<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pedido Voz - Ferretería</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; text-align: center; }
    .fase {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .fase.active { border: 2px solid #2563eb; }
    .fase h2 { font-size: 1rem; color: #555; margin-bottom: 6px; }
    .valor { font-size: 1.3rem; font-weight: 600; }
    #lista {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      min-height: 120px;
      margin-bottom: 16px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 1.05rem;
    }
    .item:last-child { border-bottom: none; }
    .editar {
      background: #e5e7eb;
      color: #222;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-right: 6px;
    }
    .borrar {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .botones {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      padding: 16px;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #btnEscuchar {
      background: #2563eb;
      color: white;
    }
    #btnEscuchar.escuchando {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }
    #btnEnviar {
      background: #16a34a;
      color: white;
    }
    #btnReiniciar {
      background: #6b7280;
      color: white;
    }
    .estado {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
      margin: 8px 0 4px;
    }
    .estado.error {
      color: #dc2626;
      font-weight: 600;
    }
    .interim {
      text-align: center;
      font-size: 0.85rem;
      color: #2563eb;
      font-style: italic;
      min-height: 1.2em;
      margin-bottom: 8px;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Pedido por Voz</h1>

  <div class="fase" id="faseNumero">
    <h2>1. Número de cliente</h2>
    <div class="valor" id="mostrarNumero">—</div>
  </div>

  <div class="fase" id="faseNombre">
    <h2>2. Nombre del cliente (lo dices tú)</h2>
    <div class="valor" id="mostrarNombre">—</div>
  </div>

  <div class="fase" id="faseArticulos">
    <h2>3. Artículos</h2>
  </div>

  <div id="lista">
    <div style="color:#999; text-align:center; padding:20px 0;">Aún no hay artículos</div>
  </div>

  <div class="estado" id="estado">Pulsa "Empezar a escuchar"</div>
  <div class="interim" id="interim"></div>

  <div class="botones">
    <button id="btnEscuchar">🎤 Empezar a escuchar</button>
    <button id="btnEnviar">📤 Enviar por WhatsApp</button>
    <button id="btnReiniciar">🔄 Nuevo pedido</button>
  </div>

  <script>
    // ======================
    // CAPTURA DE ERRORES
    // ======================
    function mostrarError(msg) {
      const el = document.getElementById("estado");
      if (el) {
        el.textContent = "ERROR: " + msg;
        el.classList.add("error");
      }
      console.error(msg);
    }

    window.addEventListener("error", (e) => {
      mostrarError(e.message);
    });

    window.addEventListener("unhandledrejection", (e) => {
      mostrarError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
    });

    // ======================
    // SONIDO DE CONFIRMACIÓN (pitido corto, no hace falta mirar la pantalla)
    // ======================
    let audioCtx = null;
    function reproducirBeep() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        // si el audio falla, no pasa nada, seguimos sin sonido
      }
    }

    // ======================
    // CONFIGURACIÓN SUPABASE
    // ======================
    const SUPABASE_URL = "https://arthqcpqbmsjdhvubwwm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFydGhxY3BxYm1zamRodnVid3dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDg3MjcsImV4cCI6MjEwNjE4NDcyN30.D3lklXpb6ueY_TsXBlTJcuVqJx-cJtqVtv1n1leESAA";

    let supabaseClient = null;
    try {
      if (!window.supabase) {
        throw new Error("La librería de Supabase no cargó");
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      mostrarError(err.message);
    }

    // ======================
    // ESTADO
    // ======================
    let estado = {
      id: null,
      nombre: null,
      nombreLibre: null,
      lista: [],
      fase: "numero"
    };

    // ======================
    // RECONOCIMIENTO DE VOZ
    // ======================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let escuchando = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      // continuous = true: NO se para después de cada frase, se queda escuchando.
      // Esto evita el hueco de "reiniciar el micro" que hacía perder palabras
      // y obligaba a repetir.
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let textoProvisional = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const resultado = event.results[i];
          const texto = resultado[0].transcript.trim();

          if (resultado.isFinal) {
            console.log("Oído:", texto);
            document.getElementById("interim").textContent = "";
            procesarTexto(texto);
          } else {
            textoProvisional = texto;
          }
        }

        if (textoProvisional) {
          document.getElementById("interim").textContent = "Escuchando: " + textoProvisional;
        }
      };

      recognition.onend = () => {
        document.getElementById("interim").textContent = "";
        // Aunque sea continuo, el navegador a veces corta la sesión solo
        // (silencio largo, límite de tiempo). Si seguimos en modo escucha,
        // reiniciamos al instante, sin esperar.
        if (escuchando) {
          try { recognition.start(); } catch (e) { /* ya estaba iniciado */ }
        }
      };

      recognition.onerror = (e) => {
        console.error("Error de voz:", e.error);
        if (e.error === "not-allowed") {
          mostrarError("Permiso de micrófono denegado");
        } else if (e.error === "no-speech") {
          // No se detectó voz en un momento puntual: no es un error real,
          // el reconocimiento seguirá escuchando (lo gestiona onend).
        } else {
          document.getElementById("estado").textContent = "Error micrófono: " + e.error;
        }
      };
    } else {
      mostrarError("Tu navegador no soporta reconocimiento de voz. Usa Safari.");
    }

    // ======================
    // BUSCAR CLIENTE
    // ======================
    async function buscarCliente(codigo) {
      if (!supabaseClient) return null;

      const { data, error } = await supabaseClient
        .from("clientes")
        .select("nombre")
        .eq("id", codigo)
        .single();

      if (error || !data) return null;
      return data.nombre;
    }

    // ======================
    // PROCESAR TEXTO
    // ======================
    async function procesarTexto(texto) {
      if (estado.fase === "numero") {
        const match = texto.match(/\d{3,5}/);
        if (match) {
          const codigo = match[0];
          document.getElementById("estado").textContent = "Buscando cliente...";
          const nombre = await buscarCliente(codigo);
          if (nombre) {
            estado.id = codigo;
            estado.nombre = nombre;
            estado.fase = "nombre";
            actualizarPantalla();
            reproducirBeep();
            document.getElementById("estado").textContent = "Número encontrado. Ahora di el nombre del cliente.";
          } else {
            document.getElementById("estado").textContent = `No existe el cliente ${codigo}. Di otro número.`;
          }
        } else {
          document.getElementById("estado").textContent = "No detecté un número. Di el código del cliente.";
        }
      }
      else if (estado.fase === "nombre") {
        estado.nombreLibre = texto;
        estado.fase = "articulos";
        actualizarPantalla();
        reproducirBeep();
        document.getElementById("estado").textContent = "Nombre guardado. Ya puedes dictar los artículos.";
      }
      else if (estado.fase === "articulos") {
        const item = parsearArticulo(texto);
        estado.lista.push(item);
        actualizarPantalla();
        reproducirBeep();
        document.getElementById("estado").textContent = "Artículo añadido. Sigue dictando o envía.";
      }
    }

    // ======================
    // NÚMEROS EN TEXTO
    // ======================
    const NUMEROS_TEXTO = {
      "un": 1, "uno": 1, "una": 1, "dos": 2, "tres": 3, "cuatro": 4, "cinco": 5,
      "seis": 6, "siete": 7, "ocho": 8, "nueve": 9, "diez": 10,
      "once": 11, "doce": 12, "trece": 13, "catorce": 14, "quince": 15,
      "dieciseis": 16, "dieciséis": 16, "diecisiete": 17, "dieciocho": 18, "diecinueve": 19,
      "veinte": 20, "veintiuno": 21, "veintidos": 22, "veintidós": 22,
      "veintitres": 23, "veintitrés": 23, "veinticuatro": 24, "veinticinco": 25,
      "veintiseis": 26, "veintiséis": 26, "veintisiete": 27, "veintiocho": 28, "veintinueve": 29,
      "treinta": 30, "cuarenta": 40, "cincuenta": 50, "sesenta": 60,
      "setenta": 70, "ochenta": 80, "noventa": 90, "cien": 100
    };

    // ======================
    // LIMPIAR DESCRIPCIÓN
    // ======================
    function limpiarDescripcion(texto) {
      let desc = texto.toLowerCase().trim();

      // --- Pilas AA / AAA ---
      desc = desc.replace(/\btriple\s*a+\b/gi, "AAA");
      desc = desc.replace(/\bdoble\s*a+\b/gi, "AA");
      desc = desc.replace(/\btriple\s*aaa\b/gi, "AAA");
      desc = desc.replace(/\bdoble\s*aa\b/gi, "AA");

      // --- Convertir metros a milímetros ---
      desc = desc.replace(/(\d+[.,]?\d*)\s*(metros?|m)\b/gi, (match, num) => {
        const valor = parseFloat(num.replace(",", "."));
        return (valor * 1000) + " mm";
      });

      // --- Convertir centímetros a milímetros ---
      desc = desc.replace(/(\d+[.,]?\d*)\s*(centímetros?|centimetros?|cm)\b/gi, (match, num) => {
        const valor = parseFloat(num.replace(",", "."));
        return (valor * 10) + " mm";
      });

      if (desc.length > 0) {
        desc = desc.charAt(0).toUpperCase() + desc.slice(1);
      }

      return desc;
    }

    // ======================
    // PARSEAR ARTÍCULO
    // ======================
    function parsearArticulo(texto) {
      const palabras = texto.trim().split(/\s+/);
      const primera = (palabras[0] || "").toLowerCase().replace(/[.,]/g, "");

      let cantidad = 1;
      let descripcion = texto.trim();

      if (/^\d+$/.test(primera)) {
        cantidad = parseInt(primera, 10);
        descripcion = palabras.slice(1).join(" ").trim();
      }
      else if (primera in NUMEROS_TEXTO) {
        cantidad = NUMEROS_TEXTO[primera];
        descripcion = palabras.slice(1).join(" ").trim();
      }

      descripcion = limpiarDescripcion(descripcion);

      return {
        cantidad: cantidad,
        descripcion: descripcion
      };
    }

    // ======================
    // ACTUALIZAR PANTALLA
    // ======================
    function actualizarPantalla() {
      document.getElementById("mostrarNumero").textContent =
        estado.id ? `${estado.id} ${estado.nombre}` : "—";

      document.getElementById("mostrarNombre").textContent =
        estado.nombreLibre || "—";

      document.getElementById("faseNumero").classList.toggle("active", estado.fase === "numero");
      document.getElementById("faseNombre").classList.toggle("active", estado.fase === "nombre");
      document.getElementById("faseArticulos").classList.toggle("active", estado.fase === "articulos");

      const listaDiv = document.getElementById("lista");
      if (estado.lista.length === 0) {
        listaDiv.innerHTML = `<div style="color:#999; text-align:center; padding:20px 0;">Aún no hay artículos</div>`;
      } else {
        listaDiv.innerHTML = estado.lista.map((item, i) => `
          <div class="item">
            <span>${item.cantidad} ${item.descripcion}</span>
            <span>
              <button class="editar" onclick="editarItem(${i})">✏️</button>
              <button class="borrar" onclick="borrarItem(${i})">✕</button>
            </span>
          </div>
        `).join("");
      }
    }

    function borrarItem(index) {
      estado.lista.splice(index, 1);
      actualizarPantalla();
    }

    function editarItem(index) {
      const item = estado.lista[index];
      const actual = `${item.cantidad} ${item.descripcion}`;
      const nuevo = prompt("Edita el artículo (cantidad y descripción):", actual);
      if (nuevo === null || nuevo.trim() === "") return;
      estado.lista[index] = parsearArticulo(nuevo.trim());
      actualizarPantalla();
    }

    // ======================
    // GENERAR TEXTO DEL PEDIDO
    // ======================
    function generarTextoPedido() {
      let texto = `PEDIDO ${estado.nombre || ""}\n`;
      texto += `${estado.nombreLibre || ""}\n\n`;
      texto += estado.lista.map(i => `${i.cantidad} ${i.descripcion}`).join("\n");
      return texto.trim();
    }

    // ======================
    // BOTONES
    // ======================
    document.getElementById("btnEscuchar").addEventListener("click", () => {
      if (!recognition) {
        mostrarError("Reconocimiento de voz no disponible");
        return;
      }

      if (escuchando) {
        escuchando = false;
        recognition.stop();
        document.getElementById("btnEscuchar").textContent = "🎤 Empezar a escuchar";
        document.getElementById("btnEscuchar").classList.remove("escuchando");
        document.getElementById("estado").textContent = "Escucha detenida";
        document.getElementById("estado").classList.remove("error");
        document.getElementById("interim").textContent = "";
      } else {
        escuchando = true;
        try {
          recognition.start();
          document.getElementById("btnEscuchar").textContent = "⏹ Dejar de escuchar";
          document.getElementById("btnEscuchar").classList.add("escuchando");
          document.getElementById("estado").textContent = "Escuchando... habla ahora";
          document.getElementById("estado").classList.remove("error");
        } catch (err) {
          mostrarError("No se pudo iniciar el micrófono: " + err.message);
          escuchando = false;
        }
      }
    });

    document.getElementById("btnEnviar").addEventListener("click", () => {
      if (!estado.id) {
        alert("Primero tienes que decir el número de cliente");
        return;
      }
      if (estado.lista.length === 0) {
        alert("No hay artículos en el pedido");
        return;
      }

      const mensaje = generarTextoPedido();
      const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
      window.open(url, "_blank");
    });

    document.getElementById("btnReiniciar").addEventListener("click", () => {
      estado = {
        id: null,
        nombre: null,
        nombreLibre: null,
        lista: [],
        fase: "numero"
      };
      actualizarPantalla();
      document.getElementById("estado").textContent = "Pedido reiniciado. Di el número de cliente.";
      document.getElementById("estado").classList.remove("error");
      document.getElementById("interim").textContent = "";
    });

    // Inicial
    actualizarPantalla();
  </script>
</body>
</html>
